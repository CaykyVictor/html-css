<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .destaque {
            background-color: chartreuse;
        }

        col.cnome {
            background-color: chartreuse;
        }

        .amarelo {
            background-color: yellow;
        }

        .azul {
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>

    <table>
        <colgroup>
            <col class="amarelo">
            <col class="azul" span="2">
            <col class="amarelo">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Rosana</td>
            <td>F</td>
            <td>52</td>
            <td>Gerente de Logística</td>
        </tr>
        <tr>
            <td>Patrick</td>
            <td>M</td>
            <td>41</td>
            <td>Motorista Particular Bilíngue</td>
        </tr>
        <tr>
            <td>Camilli</td>
            <td>F</td>
            <td>22</td>
            <td>Dentista</td>
        </tr>
        <tr>
            <td>Cayky</td>
            <td>M</td>
            <td>19</td>
            <td>TI com Foco em Inteligência Artificial</td>
        </tr>
        <tr>
            <td>Júlia</td>
            <td>F</td>
            <td>19</td>
            <td>Finanças</td>
        </tr>
        <tr>
            <td>Wellyngton</td>
            <td>M</td>
            <td>40</td>
            <td>Empresa de Rádios na Santa Ifigênia</td>
        </tr>
    </table>
</body>
</html>
