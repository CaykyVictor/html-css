<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas do Desafio</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        
        th {
            background-color: #ddd;
        }

        .area {
            font-weight: bold;
            background-color: #bbb;
        }

        .media {
            font-weight: bold;
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Provas da Escola</h1>
    <table>
        <thead>
            <tr>
                <th>Área</th>
                <th>Disciplinas</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Média</th>
            </tr>
            <tr class="area">
                <th rowspan="5">Exatas</th>
                <td>Matemática</td>
                <td>7</td>
                <td>8</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>5</td>
                <td>6</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>4</td>
                <td>8</td>
                <td>6</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>3</td>
                <td>6</td>
                <td>6</td>
            </tr>
            <tr class="media">
                <th colspan="3">Média de Exatas</th>
                <td>6</td>
            </tr>
            <tr class="area">
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>8</td>
                <td>9</td>
                <td>7</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>9</td>
                <td>10</td>
                <td>7</td>
            </tr>
            <tr class="media">
                <td colspan="4">Média de Humanas</td>
                <td>7</td>
            </tr>
        </thead>
    </table>
</body>
</html>
